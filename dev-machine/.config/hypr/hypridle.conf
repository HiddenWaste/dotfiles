general {
    lock_cmd = pidof hyprlock || hyprlock       # avoids starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after resume
}

listener {
    timeout = 300                               # 5 minutes
    on-timeout = loginctl lock-session          # command to run when timeout has passed
}

listener {
    timeout = 330                               # 5.5 minutes
    on-timeout = hyprctl dispatch dpms off      # command to turn off screen
    on-resume = hyprctl dispatch dpms on        # command to turn on screen when activity detected
}
