# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/
# For a full list of config options, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# monitor=,preferred,auto,auto

# hl.monitor({ output = "", mode = "preferred", position = "auto", scale = 1 })

# Secondary Display: Philips (Right side, 1080p)
monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1
# Main Display: BenQ (Left side, 1440p)
monitor = DP-1, 2560x1440@60, 0x0, 1

#hl.monitor({ output = "DP-1", mode = "1920x1080", position = "0x0", scale = 1 })
#hl.monitor({ output = "HDMI-A-1", mode = "1920x1080", position = "1920x0", scale = 1 })

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
# $fileManager = dolphin
# $menu = hyprlauncher


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

exec-once = ulauncher    # application launcher, open on startup

# Hypr stuffs
exec-once = hypridle      # Goes dark while valid
exec-once = hyprpaper

# exec-once = waybar        # Status Bar
#exec-once = awww-daemon & # wallpaper engine

exec-once = /usr/lib/polkit-kde-authentication-agent-1

# start clipboard manager
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

# portals are refreshed?
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

# Sets cursor theme!
env = HYPRCURSOR_THEME,oxy-neon
env = XCURSOR_THEME,oxy-neon
env = XCURSOR_SIZE,20

cursor_inactive_timeout = 1

env = GTK_THEME,Adwaita-dark

