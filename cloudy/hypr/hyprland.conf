#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 18

    border_size = 3

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # active/inactive window border colors below! TODO: Make programatic?
    #   The format is 2 more than hex color codes. i.e. the first 6 are the color code
    #   and the last 2 characters are the transparency value
    # note: the first item is at top and the border gradients to second value
    col.active_border = rgba(e66100ee) rgba(e01b24ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 12
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0  # Sets global fallback for background windows

    shadow {
        enabled = true
        range = 9
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,            X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
# CUSTOM:
#  -- mapped caps to escape!
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
#################
# https://wiki.hypr.land/Configuring/Binds/ for more

# Specific Applications
bind = SUPER, SPACE, exec, ulauncher-toggle # Ulauncher
bind = SUPER, Q, exec, kitty                # kitty
bind = SUPER, z, exec, ~/.local/bin/zen     # zen browser
bind = SUPER SHIFT, Z, exec, kitty -- bash -ic "z" # kitty straight into zellij!
bind = SUPER, d, exec, /snap/bin/discord    # discord (social)
bind = SUPER, s, exec, /snap/bin/steam      # steam (gaming)
bind = SUPER, b, exec, kitty -- bash -ic "z --layout dashboard" # system control panel
bind = SUPER, TAB, exec, ~/.config/hypr/scripts/window_switcher.sh

# Brightness Control
bindel = , F3, exec, brightnessctl set 5%+
bindel = , F2, exec, brightnessctl set 5%-

# Snipping tool (Select area -> Copy to clipboard)
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy


# various window state changes
bind = SUPER, C, killactive,
bind = SUPER, f, fullscreen,
bind = SUPER, V, togglefloating,
bind = SUPER, P, pseudo, # dwindle

# Move focus with mainMod + Vim Motions!
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

# Move window with SUPER SHIFT + Vim Motions
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = SUPER, S, togglespecialworkspace, magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from all apps
windowrule = match:class .*, suppress_event maximize

# Fix dragging issues with XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on

# Hyprland-run windowrule
windowrule = match:class hyprland-run, float on
windowrule = match:class hyprland-run, move 20 monitor_h-120

# --- PICTURE-IN-PICTURE OVERRIDES ---
# Force standard windows to use 0.8 opacity when inactive
windowrule = match:class .*, opacity 1.0 0.8

# Keep Browser Picture-in-Picture windows 100% solid, pinned, and floating
windowrule = match:title ^(Picture-in-Picture|Picture in Picture)$, opacity 1.0 1.0

# above rule may not catch discord
windowrule = match:class ^(discord)$, match:title negative:^(Discord|.*Discord.*)$, opacity 1.0 1.0
